services:
  # Backend: C++ API server via Docker
  - type: web
    name: scientific-calculator-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    branch: main
    # Render automatically sets PORT environment variable
    # Our application reads it with std::getenv("PORT")

  # Frontend: Static HTML/CSS/JS site
  - type: web
    name: scientific-calculator-frontend
    runtime: static
    staticPublishPath: ./frontend
    branch: main
    envVars:
      - key: BACKEND_URL
        value: https://scientific-calculator-backend-9o2o.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html