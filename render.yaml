services:
  # Backend: C++ API server via Docker
  - type: web
    name: scientific-calculator-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: PORT
        value: 10000

  # Frontend: Static HTML/CSS/JS site
  - type: web
    name: scientific-calculator-frontend
    env: static
    staticPublishPath: ./frontend
    plan: free
    region: oregon
    branch: main
    routes:
      - type: rewrite
        source: /*
        destination: /index.html